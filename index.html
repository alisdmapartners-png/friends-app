<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Friends</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3e6d3; --cream2:#ead7bd; --paper:#fbf5ec; --brown:#3c2418; --brown2:#5a3a2a; --caramel:#8c4a24;
  --line:rgba(60,36,24,.12); --muted:rgba(60,36,24,.62); --ok:#3f7a4a; --err:#a5402b;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--brown);font:500 15px/1.4 Onest,system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3,.nun{font-family:Nunito,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.screen{display:none;animation:in .38s var(--ease) both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.logo{font:900 26px/1 Nunito;letter-spacing:-.02em}
.langs{display:flex;background:var(--cream2);border-radius:999px;padding:3px}
.langs button{padding:6px 10px;border-radius:999px;font:700 12px Nunito;color:var(--muted);transition:.2s}
.langs button.on{background:var(--brown);color:var(--cream)}

/* loyalty card */
.card{background:var(--brown);color:var(--cream);border-radius:26px;padding:20px 18px 18px;position:relative;overflow:hidden}
.card .hi{font:800 20px Nunito}
.card .sub{opacity:.75;font-size:13px;margin-top:2px}
.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 16px}
.cup{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(243,230,211,.35);display:grid;place-items:center}
.cup svg{width:62%;height:62%;opacity:0;transform:scale(.4) rotate(-20deg)}
.cup.full{border:2px solid var(--cream);background:var(--cream)}
.cup.full svg{animation:pop .5s var(--ease) forwards}
.cup.gift{border-style:solid;border-color:rgba(243,230,211,.6)}
.cup.gift span{font-size:20px}
@keyframes pop{to{opacity:1;transform:none}}
.code{display:flex;align-items:center;justify-content:space-between;background:rgba(243,230,211,.1);border-radius:16px;padding:12px 14px}
.code b{font:900 28px/1 Nunito;letter-spacing:.06em}
.code small{display:block;opacity:.7;font-size:12px;margin-bottom:4px}
.code .stamp{font:800 13px Nunito;background:var(--cream);color:var(--brown);border-radius:999px;padding:6px 10px}
.join{background:var(--paper);border-radius:26px;padding:20px;text-align:center;border:1px solid var(--line)}
.join p{color:var(--muted);margin:8px 0 16px}
.inp{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font:600 17px/1.2 Onest,system-ui,sans-serif;color:var(--ink,#3c2418);margin:0 0 12px;outline:none;text-align:center}
.inp:focus{border-color:#8c4a24}
.join.name{margin-bottom:14px;animation:pop .35s ease}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;background:var(--brown);color:var(--cream);font:800 17px Nunito;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--cream2);color:var(--brown)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px}
.tile b{font:800 17px Nunito;display:block}
.tile small{color:var(--muted)}
.tile.big{grid-column:1/-1;background:var(--caramel);color:var(--cream);border:0;min-height:96px;flex-direction:row;align-items:center}
.tile.big small{color:rgba(243,230,211,.8)}

/* active order */
.active{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.active .row{display:flex;justify-content:space-between;align-items:baseline}
.active .row b{font:900 22px Nunito}
.steps{display:flex;gap:6px;margin:14px 0 6px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--cream2);position:relative;overflow:hidden}
.steps i.on{background:var(--brown)}
.steps i.now::after{content:"";position:absolute;inset:0;background:var(--caramel);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.steplbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.link{color:var(--err);font-weight:600;margin-top:10px;font-size:14px}

/* cafés */
.cafe{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;width:100%;text-align:left;transition:transform .15s}
.cafe:active{transform:scale(.98)}
.cafe .pin{width:52px;height:52px;border-radius:16px;background:var(--cream2);display:grid;place-items:center;font:900 22px Nunito}
.cafe b{font:800 19px Nunito;display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* menu */
.mhead{position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.mtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mtitle h2{font-size:24px}
.switch{font:700 13px Nunito;background:var(--cream2);border-radius:999px;padding:7px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font:700 14px Nunito;white-space:nowrap;transition:.2s}
.chip.on{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.closed{background:var(--cream2);border-radius:14px;padding:10px 12px;font-size:13px;margin:6px 0 4px}
.sect{font:900 20px Nunito;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s;animation:in .4s var(--ease) both}
.item:active{transform:scale(.97)}
.ph{aspect-ratio:1;background:var(--cream2);display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:70%;height:70%}
.ph .q{position:absolute;top:8px;right:8px;background:var(--brown);color:var(--cream);font:800 12px Nunito;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.item .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item b{font:800 15px/1.2 Nunito}
.item small{color:var(--muted);font-size:12px;line-height:1.3}
.item .pr{margin-top:auto;padding-top:6px;font:800 14px Nunito;color:var(--caramel)}
.steam path{animation:steam 2.6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(60,36,24,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:28px 28px 0 0;max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .38s var(--ease);max-height:92vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .ph{aspect-ratio:16/11;border-radius:28px 28px 0 0}
.sheet .grab{position:absolute;top:8px;left:50%;width:40px;height:5px;border-radius:5px;background:rgba(60,36,24,.25);transform:translateX(-50%);z-index:2}
.sheet .in{padding:16px}
.sheet h3{font-size:24px}
.sheet p{color:var(--muted);margin:6px 0 14px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:12px 6px;border-radius:14px;background:var(--cream);border:2px solid transparent;font:800 15px Nunito;transition:.2s}
.seg button small{display:block;font:600 12px Onest;color:var(--muted)}
.seg button.on{border-color:var(--brown);background:var(--paper)}
.qty{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.step{display:flex;align-items:center;gap:4px;background:var(--cream);border-radius:14px;padding:4px}
.step button{width:40px;height:40px;border-radius:11px;font:900 20px Nunito;background:var(--paper)}
.step span{min-width:30px;text-align:center;font:900 18px Nunito}

/* cart */
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .ph{width:56px;height:56px;border-radius:14px;flex:none}
.line .ph svg{width:80%;height:80%}
.line .nm{flex:1}
.line .nm b{font:800 15px Nunito;display:block}
.line .nm small{color:var(--muted)}
.line .step button{width:32px;height:32px;font-size:17px}
.line .step span{min-width:22px;font-size:15px}
.label{font:900 17px Nunito;margin:20px 0 10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 4px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font:800 15px Nunito;transition:.2s}
.slot.on{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.slot:disabled{opacity:.35;text-decoration:line-through}
.pay{display:flex;gap:10px}
.pay button{flex:1;padding:14px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font:800 15px Nunito;text-align:left;transition:.2s}
.pay button small{display:block;font:500 12px Onest;color:var(--muted);margin-top:2px}
.pay button.on{border-color:var(--brown)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 6px;font:900 22px Nunito}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}

/* success */
.done{text-align:center;padding:30px 6px}
.check{width:110px;height:110px;margin:10px auto 18px}
.check circle{stroke-dasharray:320;stroke-dashoffset:320;animation:draw .7s var(--ease) forwards}
.check path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s .55s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-size:28px}
.done .big{font:900 44px/1 Nunito;letter-spacing:.04em;margin:18px 0 6px}
.bump{animation:bump .4s var(--ease)}
@keyframes bump{50%{transform:scale(1.25)}}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:40;background:var(--brown);color:var(--cream);border-radius:16px;padding:12px 14px;font-weight:600;transform:translateY(-140%);transition:transform .35s var(--ease);max-width:528px;margin:0 auto}
.toast.on{transform:none}
.load{display:grid;place-items:center;min-height:80vh}
.load svg{width:90px}
.fallbtn{margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cup.full svg{opacity:1;transform:none}}
</style>
</head>

</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

/* ---------- navigation ---------- */
function go(id, push = true) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  if (push && stack[stack.length - 1] !== id) stack.push(id);
  window.scrollTo(0, 0);
  try { stack.length > 1 && id !== "done" ? tg.BackButton.show() : tg.BackButton.hide(); } catch {}
  if (id === "home") renderHome();
  updateMain();
}
function back() {
  if ($("#sheet").classList.contains("on")) return closeSheet();
  stack.pop();
  go(stack[stack.length - 1] || "home", false);
}

/* ---------- Telegram main button ---------- */
let mainHandler = null;
function setMain(text, fn) {
  try {
    if (mainHandler) tg.MainButton.offClick(mainHandler);
    mainHandler = fn;
    if (!text) return tg.MainButton.hide();
    tg.MainButton.setParams({ text, color: "#3c2418", text_color: "#f3e6d3", is_active: true, is_visible: true });
    tg.MainButton.onClick(mainHandler);
  } catch {}
}
function updateMain() {
  const cur = stack[stack.length - 1];
  if ($("#sheet").classList.contains("on")) return;
  if (cur === "menu" && count()) return setMain(t().cartBtn(count(), fmt(sum())), () => { go("cart"); renderCart(); });
  if (cur === "cart" && count()) {
    if (!pay || !(D.pays || []).includes(pay)) pay = (D.pays || [])[0] || null;
    const ready = slot && cafeOpen() && pay;
    if (!ready) return setMain(null);
    return setMain(t().payBtn(fmt(sum())), place);
  }
  setMain(null);
}

/* ---------- item sheet ---------- */
let sheetItem = null, sheetSize = null, sheetQty = 1;
function openSheet(id) {
  const it = find(id); if (!it) return;
  sheetItem = it; sheetSize = it.sizes[Math.min(1, it.sizes.length - 1)] ?? null; sheetQty = 1;
  drawSheet();
  $("#veil").classList.add("on"); $("#sheet").classList.add("on");
  haptic("light");
  try { tg.BackButton.show(); } catch {}
  const k = () => (sheetItem.sizes.length ? sheetItem.sizes.indexOf(sheetSize) : 0);
  setMain(`${t().add} · ${fmt((sheetItem.prices[k()] ?? sheetItem.prices[0]) * sheetQty)} ${t().sum}`, addToCart);
}
function drawSheet() {
  const it = sheetItem, k = it.sizes.length ? it.sizes.indexOf(sheetSize) : 0;
  $("#sheet").innerHTML = `<div class="grab"></div><div class="ph">${pic(it, true)}</div><div class="in"><h3>${nm(it).replace("★ ", "")}</h3><p>${ds(it)}</p>
    ${it.sizes.length ? `<div class="label" style="margin-top:0">${t().size}</div><div class="seg">${it.sizes.map((s, i) => `<button class="${s === sheetSize ? "on" : ""}" data-size="${s}">${s}<small>${fmt(it.prices[i])} ${t().sum}</small></button>`).join("")}</div>` : ""}
    <div class="qty"><b class="nun" style="font-size:17px">${t().qty}</b><div class="step"><button data-q="-1">−</button><span>${sheetQty}</span><button data-q="1">+</button></div></div>
    ${tg?.MainButton && tg.platform !== "unknown" ? "" : `<button class="btn" id="sheetAdd">${t().add} · ${fmt((it.prices[k] ?? it.prices[0]) * sheetQty)} ${t().sum}</button>`}</div>`;
}
function closeSheet() {
  $("#veil").classList.remove("on"); $("#sheet").classList.remove("on");
  if (stack.length <= 1) try { tg.BackButton.hide(); } catch {}
  updateMain();
}
function addToCart() {
  if (count() + sheetQty > D.maxDrinks) { haptic("err"); return toast(t().max(D.maxDrinks)); }
  const same = cart.find((x) => x.id === sheetItem.id && x.size === sheetSize);
  if (same) same.qty += sheetQty; else cart.push({ id: sheetItem.id, size: sheetSize, qty: sheetQty });
  haptic("medium"); toast(`${t().added}: ${nm(sheetItem).replace("★ ", "")}`);
  closeSheet(); renderMenu();
}

  const c = D.cafes.find((x) => x.id === cafe);
  $("#cartTitle").textContent = t().yourOrder;
  $("#cartCafe").textContent = `📍 ${c.name[L]}`;
  if (!cart.length) {
    $("#cartLines").innerHTML = `<div class="empty"><div style="font-size:44px">🧺</div><p>${t().empty}</p><button class="btn ghost" id="toMenu">${t().toMenu}</button></div>`;
    $("#checkout").innerHTML = ""; return updateMain();
  }
  $("#cartLines").innerHTML = cart.map((x, i) => { const it = find(x.id); return `<div class="line"><div class="ph">${pic(it, false)}</div><div class="nm"><b>${nm(it).replace("★ ", "")}${x.size ? " " + x.size : ""}</b><small>${fmt(priceOf(x) * x.qty)} ${t().sum}</small></div><div class="step"><button data-cq="-1" data-i="${i}">−</button><span>${x.qty}</span><button data-cq="1" data-i="${i}">+</button></div></div>`; }).join("");
  if (!c.open) { $("#checkout").innerHTML = `<div class="closed" style="margin-top:16px">⏰ ${t().closedNote}</div>`; return updateMain(); }
  if (!pay || !(D.pays || []).includes(pay)) pay = (D.pays || [])[0] || null;
  $("#checkout").innerHTML = `<div class="label">${t().pickup}</div><div id="slotBox"><div class="note">…</div></div>
    <div class="label">${t().pay}</div>${!D.pays?.length ? `<div class="note">${t().paySoon}</div>`
      : D.pays.length === 1 ? `<div class="note">${t().payVia(D.pays[0] === "rahmat")}</div>`
      : `<div class="pay">${D.pays.map((x) => `<button data-pay="${x}" class="${x === pay ? "on" : ""}">💳 ${PAYN[x] || x}<small>${t().payHint}</small></button>`).join("")}</div>`}
    <div class="total"><span>${t().total}</span><span>${fmt(sum())} ${t().sum}</span></div><div class="note">${t().rule}</div>`;
  const r = await api("slots", { cafe });
  slotsCache = r.slots || [];
  drawSlots();
}
function drawSlots() {
  const need = count();
  if (!slotsCache.length) { $("#slotBox").innerHTML = `<div class="note">${t().noSlots}</div>`; slot = null; return updateMain(); }
  if (slot && !slotsCache.find((s) => s.label.replace(":", "") === slot && s.left >= need)) slot = null;
  if (!slot) { const f = slotsCache.find((s) => s.left >= need); slot = f ? f.label.replace(":", "") : null; }
  $("#slotBox").innerHTML = `<div class="slots">${slotsCache.map((s) => `<button class="slot ${s.label.replace(":", "") === slot ? "on" : ""}" data-slot="${s.label.replace(":", "")}" ${s.left < need ? "disabled" : ""}>${s.label}</button>`).join("")}</div>`;
  updateMain();
}
async function place() {
  try { tg.MainButton.showProgress(); } catch {}
  const r = await api("order", { cafe, slot, pay, items: cart.map((x) => ({ id: x.id, size: x.size, qty: x.qty })) });
  try { tg.MainButton.hideProgress(); } catch {}
  if (r.error) { haptic("err"); toast(t().err[r.error] || t().err.server); if (r.error === "slot_gone") renderCart(); return; }
  if (r.payUrl) {
    cart = []; openPay(r.payUrl);
    await refresh(); stack = ["home"]; go("home", false); checkStatus();
    return;
  }
  if (r.invoice) {
    tg.openInvoice(r.invoice, (status) => {
      if (status === "paid") { cart = []; showDone(r, true); }
      else if (status === "failed") { haptic("err"); toast(t().payCancelled); api("cancel", { id: r.id }); }
      else { api("cancel", { id: r.id }); toast(t().payCancelled); }
    });
    return;
  }
  cart = []; showDone(r, false);
}
const PAYN = { payme: "Payme", click_web: "Click", click: "Click", rahmat: "Rahmat" };
function openPay(url) {
  try { tg.openLink(url); } catch { window.open(url, "_blank"); }
}
function showDone(r, paid) {
  haptic("ok");
  const code = D.card?.code || "";
  $("#doneBox").innerHTML = `<svg class="check" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#3c2418" stroke-width="7"/><path d="M38 62l15 15 30-32" fill="none" stroke="#3c2418" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>${paid ? t().paid : t().sent}</h2><div class="big">${r.code}</div><div style="font-weight:700">${t().pickAt(r.pickup)}</div>
    ${code ? `<p class="note" style="margin:14px 0 22px">${t().showCode(code)}</p>` : ""}<button class="btn" id="doneHome">${t().home}</button>`;
  stack = ["home", "done"]; go("done", false);
  refresh();
}

/* ---------- data ---------- */
async function refresh() {
  const r = await api("init");
  if (r.error) return r;
  D = r; if (!cafe) cafe = D.card?.home || "UWED";
  return r;
}
function startPoll() {
  clearInterval(poll);
  poll = setInterval(async () => {
    if (!D?.joined) { const r = await refresh(); if (!r?.error && D.joined && stack[stack.length - 1] === "home") renderHome(); return; }
    if (!D.active) return;
    await checkStatus();
  }, 12000);
}
async function checkStatus() {
  if (!D?.active) return;
  const r = await api("status");
  if (r.error) return;
  const was = D.active;
  if (r.active?.status !== was?.status || !!r.active?.paid !== !!was?.paid) {
    if (r.active?.status === "ready") haptic("ok");
    if (was?.status === "awaiting_payment" && r.active?.paid) { haptic("ok"); toast(t().paid); }
    else if (was?.status === "awaiting_payment" && !r.active) toast(t().payCancelled);
    D.active = r.active; if (stack[stack.length - 1] === "home") renderActive();
  }
  clearTimeout(checkStatus.t);
  if (D.active?.status === "awaiting_payment") checkStatus.t = setTimeout(checkStatus, 4000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkStatus(); });
try { tg.onEvent("activated", () => checkStatus()); } catch {}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.dataset.l) { L = el.dataset.l; haptic(); api("lang", { lang: L }); document.documentElement.lang = L; renderHome(); return; }
  if (el.id === "joinBtn") {
    try { tg.requestContact((ok) => { if (ok) { haptic("ok"); toast(t().joined); setTimeout(async () => { await refresh(); renderHome(); }, 2500); } }); }
    catch { tg.openTelegramLink(BOT); }
    return;
  }
  if (el.id === "nameBtn") {
    const v = ($("#nameIn")?.value || "").trim();
    if (!v) { haptic("err"); $("#nameIn")?.focus(); return; }
    el.disabled = true;
    const r = await api("name", { name: v });
    el.disabled = false;
    if (r.error) { haptic("err"); return toast(t().err[r.error] || t().err.server); }
    haptic("ok"); toast(t().nameOk(r.name)); D.card.name = r.name; D.card.needName = false; renderHome(); return;
  }
  if (el.id === "tOrder") { if (!D.joined) { haptic("err"); return toast(t().err.not_joined); } if (D.card?.needName) { haptic("err"); $("#nameIn")?.focus(); return toast(t().err.no_name); } if (D.active) { haptic("err"); return toast(t().err.active); } renderCafes(); return go("cafes"); }
  if (el.id === "tMenu") { curCat = null; renderMenu(); return go("menu"); }
  if (el.id === "tBot") { try { tg.openTelegramLink(BOT); tg.close(); } catch { location.href = BOT; } return; }
  if (el.dataset.cafe) { if (cafe !== el.dataset.cafe) cart = []; cafe = el.dataset.cafe; curCat = null; haptic(); renderMenu(); return go("menu"); }
  if (el.id === "cafeSwitch") { renderCafes(); return go("cafes"); }
  if (el.dataset.cat) { document.getElementById("s-" + el.dataset.cat)?.scrollIntoView({ behavior: "smooth", block: "start" }); window.scrollBy(0, -120); return; }
  if (el.classList.contains("item")) return openSheet(el.dataset.id);
  if (el.dataset.size) { sheetSize = el.dataset.size; haptic("light"); drawSheet(); return openSheetMain(); }
  if (el.dataset.q) { sheetQty = Math.max(1, Math.min(D.maxDrinks, sheetQty + Number(el.dataset.q))); haptic("light"); drawSheet(); return openSheetMain(); }
  if (el.id === "sheetAdd") return addToCart();
  if (el.dataset.cq) { const x = cart[Number(el.dataset.i)]; const nq = x.qty + Number(el.dataset.cq); if (nq > 0 && count() + Number(el.dataset.cq) > D.maxDrinks) { haptic("err"); return toast(t().max(D.maxDrinks)); } x.qty = nq; if (x.qty <= 0) cart.splice(Number(el.dataset.i), 1); haptic("light"); return renderCart(); }
  if (el.dataset.slot) { slot = el.dataset.slot; haptic("light"); return drawSlots(); }
  if (el.id === "toMenu") return back();
  if (el.id === "payNowBtn") { if (D.active?.pay_url) openPay(D.active.pay_url); return; }
  if (el.id === "cancelBtn") { const r = await api("cancel", { id: Number(el.dataset.id) }); if (r.ok) { toast(t().cancelled); D.active = null; renderActive(); } else toast(t().err.server); return; }
  if (el.id === "doneHome") { stack = ["home"]; return go("home", false); }
});
function openSheetMain() { const k = sheetItem.sizes.length ? sheetItem.sizes.indexOf(sheetSize) : 0; setMain(`${t().add} · ${fmt((sheetItem.prices[k] ?? sheetItem.prices[0]) * sheetQty)} ${t().sum}`, addToCart); }
$("#veil").addEventListener("click", closeSheet);
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("[data-pay]");
  if (!b) return;
  pay = b.dataset.pay; haptic("light");
  document.querySelectorAll(".pay button").forEach((x) => x.classList.toggle("on", x.dataset.pay === pay));
  updateMain();
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "nameIn") { e.preventDefault(); $("#nameBtn")?.click(); } });

/* ---------- start ---------- */
(async function start() {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor("#f3e6d3"); tg.setBackgroundColor("#f3e6d3");
    try { tg.setBottomBarColor?.("#f3e6d3"); } catch {}
    tg.BackButton.onClick(back);
    tg.enableClosingConfirmation?.(); tg.disableClosingConfirmation?.();
  } catch {}
  const r = await refresh();
  $("#loading").remove();
  if (!r || r.error) {
    document.querySelector(".wrap").insertAdjacentHTML("beforeend", `<div class="empty"><div style="font-size:44px">☕</div><p>${(W[L].err[r?.error] || W[L].err.server)}</p><a class="btn fallbtn" href="${BOT}">@friendscofe_bot</a></div>`);
    return;
  }
  L = D.lang; document.documentElement.lang = L;
  const sp = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get("start") || "";
  if (sp === "menu") { renderMenu(); stack = ["home", "menu"]; go("menu", false); try { tg.BackButton.show(); } catch {} }
  else if (sp === "order" && D.joined && !D.active) { renderCafes(); stack = ["home", "cafes"]; go("cafes", false); try { tg.BackButton.show(); } catch {} }
  else go("home", false);
  startPoll(); checkStatus();
})();
</script>
</body>
